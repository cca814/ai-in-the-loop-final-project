name: Intent Supervisor Stage 2

# Runs after Stage 1 on every PR push (called from the checklist pipeline) to request
# owner reviews and set the merge gate, and again on review events to re-check the gate.
on:
  workflow_call:
    inputs:
      report-run-id:
        description: Workflow run that uploaded the Stage 1 report
        required: true
        type: string
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  route:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event_name == 'pull_request' || github.event.action == 'dismissed' ||
       github.event.review.state != 'commented')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      # Per event type, so a review re-check never cancels reviewer requests after a push.
      group: intent-supervisor-stage2-${{ github.event.pull_request.number }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      # Router script and config come from main so a PR cannot change its own routing.
      # The same checkout is the codebase searched for code that depends on the change.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Collect PR state and find Stage 1 report
        id: pr
        uses: actions/github-script@v7
        env:
          REPORT_RUN_ID: ${{ inputs.report-run-id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number, per_page: 100,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number, per_page: 100,
            });
            // Latest decisive review per user; only approvals of the current head count.
            const latest = new Map();
            for (const review of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                latest.set(review.user.login, review);
              }
            }
            const approvers = [...latest.values()]
              .filter(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha)
              .map(r => r.user.login);
            const prContext = {
              head_sha: pr.head.sha,
              author: pr.user.login,
              changed_files: files.map(f => f.filename),
              // Old names of renamed files are searched for dependents too.
              files: files.map(f => ({
                filename: f.filename, previous_filename: f.previous_filename,
              })),
              approvers,
            };
            const dir = path.join(process.env.RUNNER_TEMP, 'stage2');
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, 'pr-context.json'), JSON.stringify(prContext, null, 2));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('open', pr.state === 'open' ? 'true' : 'false');

            // Called after Stage 1: the report is in the caller's run. Review event: look it up.
            if (process.env.REPORT_RUN_ID) {
              core.setOutput('artifact_run_id', process.env.REPORT_RUN_ID);
              return;
            }
            const name = `significant-change-report-pr-${pull_number}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name, per_page: 100,
            });
            const match = artifacts
              .filter(a => !a.expired && a.workflow_run?.head_sha === pr.head.sha)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            core.setOutput('artifact_run_id', match ? String(match.workflow_run.id) : '');
            if (!match) core.warning(`No Stage 1 report artifact found for ${pr.head.sha}.`);

      - name: Download Stage 1 report
        if: steps.pr.outputs.open == 'true' && steps.pr.outputs.artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: significant-change-report-pr-${{ github.event.pull_request.number }}
          run-id: ${{ steps.pr.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage1

      - name: Decide routing
        if: steps.pr.outputs.open == 'true'
        run: |
          python3 scripts/impact_router.py \
            --config .github/intent-supervisor.json \
            --report "$RUNNER_TEMP/stage1/report.json" \
            --pr-context "$RUNNER_TEMP/stage2/pr-context.json" \
            --output "$RUNNER_TEMP/stage2/decision.json" \
            --markdown-output "$RUNNER_TEMP/stage2/decision.md"
          cat "$RUNNER_TEMP/stage2/decision.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply routing
        if: steps.pr.outputs.open == 'true'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.env.RUNNER_TEMP, 'stage2');
            const decision = JSON.parse(fs.readFileSync(path.join(dir, 'decision.json'), 'utf8'));
            let report = fs.readFileSync(path.join(dir, 'decision.md'), 'utf8');
            const pull_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Request reviewers only on pushes; on review events just re-check the gate,
            // so an owner who requests changes is not immediately re-requested.
            if (context.eventName === 'pull_request' && decision.reviewers_to_request.length) {
              try {
                await github.rest.pulls.requestReviewers({
                  ...context.repo, pull_number, reviewers: decision.reviewers_to_request,
                });
              } catch (error) {
                core.warning(`Could not request reviewers: ${error.message}`);
                report += `\n_Could not request reviewers automatically: ${error.message}_\n`;
              }
            }

            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: decision.state,
              context: decision.context, description: decision.description, target_url: runUrl,
            });

            const marker = '<!-- intent-supervisor-stage2 -->';
            const body = `${marker}\n${report}\n[Workflow run](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pull_number, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pull_number, body });
            }
