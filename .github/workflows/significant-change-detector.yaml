name: Significant Change Detector

on:
  workflow_call:
    inputs:
      checklist-sha:
        description: Main snapshot used to generate the checklist
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: significant-change-report-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head for detector script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download generated checklist
        uses: actions/download-artifact@v4
        with:
          name: significant-change-checklist-${{ inputs.checklist-sha }}
          path: ${{ runner.temp }}/significant-change-checklist

      - name: Check PR revision
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const current = pr.state === 'open' &&
              pr.head.sha === context.payload.pull_request.head.sha;
            core.setOutput('current', current ? 'true' : 'false');
            if (!current) core.notice('Skipping closed PR or outdated head revision.');

      - name: Fetch checklist baseline for diff
        if: steps.pr.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKLIST_SHA: ${{ inputs.checklist-sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags origin "$CHECKLIST_SHA"
          git cat-file -e "$CHECKLIST_SHA^{commit}"
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          test -f scripts/significant_change_detector.py

      - name: Select AI provider
        if: steps.pr.outputs.current == 'true'
        id: provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            echo "name=gemini" >> "$GITHUB_OUTPUT"
          elif [[ -n "$OPENAI_API_KEY" ]]; then
            echo "name=openai" >> "$GITHUB_OUTPUT"
          elif [[ -n "$ANTHROPIC_API_KEY" ]]; then
            echo "name=anthropic" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No AI API key configured"
            exit 1
          fi

      - name: Analyze significant changes
        if: steps.pr.outputs.current == 'true'
        id: analysis
        env:
          PROVIDER: ${{ steps.provider.outputs.name }}
          CHECKLIST_SHA: ${{ inputs.checklist-sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/significant_change_detector.py \
            --provider "$PROVIDER" \
            --checklist-path "$RUNNER_TEMP/significant-change-checklist/$CHECKLIST_SHA.md" \
            --base-ref "$CHECKLIST_SHA" \
            --head-ref "$PR_HEAD_SHA" \
            --pr-event-path "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/significant-change-report/report.md" \
            --json-output "$RUNNER_TEMP/significant-change-report/report.json"

      - name: Upload change report
        if: steps.pr.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: significant-change-report-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/significant-change-report/
          if-no-files-found: error

      - name: Create or update PR report comment
        if: steps.pr.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: issue_number,
            });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.notice('PR changed during analysis; not posting an outdated report.');
              return;
            }
            const marker = '<!-- significant-change-detector-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = fs.readFileSync(path.join(process.env.RUNNER_TEMP,
              'significant-change-report', 'report.md'), 'utf8');
            // Leave room below GitHub's comment limit, including multi-byte text.
            const maxBytes = 55000;
            if (Buffer.byteLength(report, 'utf8') > maxBytes) {
              const characters = Array.from(report);
              let size = 0;
              report = '';
              for (const character of characters) {
                size += Buffer.byteLength(character, 'utf8');
                if (size > maxBytes) break;
                report += character;
              }
              report += '\n\n_Report truncated; download the complete report from the workflow artifacts._';
            }
            const body = `${marker}\n${report}\n\n[Workflow run and complete report](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
